# Requires Docker Compose 2.24.4+ for !reset. Use together with compose.yaml.
services:
  app:
    environment:
      DJANGO_ENV: production
      TRUST_PROXY: "true"
      ALLOWED_HOSTS: "${DOMAIN:?Please set DOMAIN in .env},localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://${DOMAIN:?Please set DOMAIN in .env}"
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?Please set DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
