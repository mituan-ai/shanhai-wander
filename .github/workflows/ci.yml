name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py createcachetable
      - run: python manage.py seed_routes
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
      - name: Check production security settings
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_ENV: production
          ALLOWED_HOSTS: trip.example.com,localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS: https://trip.example.com
          TRUST_PROXY: "true"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start application
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 180
      - name: Check HTTP and persistent database
        run: |
          curl --fail http://127.0.0.1:8000/health/
          docker compose exec -T app python manage.py check
          docker compose exec -T app python scripts/backup.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
      - name: Print logs and stop
        if: always()
        run: |
          docker compose logs --tail=80
          docker compose down
