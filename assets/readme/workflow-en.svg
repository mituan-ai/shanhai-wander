<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">Three steps to your next trip</title><desc id="desc">Choose a route, arrange your stops, then save and share.</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="1200" height="220" rx="16" fill="#285544"/><text x="48" y="62" font-family="Georgia,serif" font-size="31" fill="#c7d6b7">01</text><text x="48" y="112" font-size="27" font-weight="600" fill="#fff">Choose a route</text><text x="48" y="157" font-size="18" fill="#d1dfca">Start with 30 routes, or your own</text><path d="M370 70h27m-8-8 8 8-8 8" stroke="#c7d6b7" stroke-width="2" fill="none"/><text x="444" y="62" font-family="Georgia,serif" font-size="31" fill="#c7d6b7">02</text><text x="444" y="112" font-size="27" font-weight="600" fill="#fff">Plan each day</text><text x="444" y="157" font-size="18" fill="#d1dfca">Add places, stays and charging stops</text><path d="M766 70h27m-8-8 8 8-8 8" stroke="#c7d6b7" stroke-width="2" fill="none"/><text x="840" y="62" font-family="Georgia,serif" font-size="31" fill="#c7d6b7">03</text><text x="840" y="112" font-size="27" font-weight="600" fill="#fff">Save and go</text><text x="840" y="157" font-size="18" fill="#d1dfca">Keep it private, export or share</text></g></svg>