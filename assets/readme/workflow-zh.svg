<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">Three steps to your next trip</title><desc id="desc">Choose a route, arrange your stops, then save and share.</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="1200" height="220" rx="16" fill="#285544"/><text x="48" y="62" font-family="Georgia,serif" font-size="31" fill="#c7d6b7">01</text><text x="48" y="112" font-size="27" font-weight="600" fill="#fff">选一条路线</text><text x="48" y="157" font-size="18" fill="#d1dfca">30 条经典路线，也能自己创建</text><path d="M370 70h27m-8-8 8 8-8 8" stroke="#c7d6b7" stroke-width="2" fill="none"/><text x="444" y="62" font-family="Georgia,serif" font-size="31" fill="#c7d6b7">02</text><text x="444" y="112" font-size="27" font-weight="600" fill="#fff">安排每一天</text><text x="444" y="157" font-size="18" fill="#d1dfca">景点、酒店、充电停靠一起排</text><path d="M766 70h27m-8-8 8 8-8 8" stroke="#c7d6b7" stroke-width="2" fill="none"/><text x="840" y="62" font-family="Georgia,serif" font-size="31" fill="#c7d6b7">03</text><text x="840" y="112" font-size="27" font-weight="600" fill="#fff">保存，出发</text><text x="840" y="157" font-size="18" fill="#d1dfca">留在账号里，也能导出与分享</text></g></svg>