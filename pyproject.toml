[project]
name = "shanhai-wander"
version = "2.0.0"
description = "山海漫游：自包含的中国旅行路线规划与分享平台"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["config*", "planner*"]
