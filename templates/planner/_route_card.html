{% load static %}<article class="route-card"><a class="route-image" href="{% url 'route_detail' route.slug %}"><img src="{% static 'images/' %}{{ route.cover_style|default:'forest' }}.svg" alt="{{ route.title }}山海风景插画" loading="lazy"><span class="image-label">{{ route.category }}</span><span class="image-arrow" aria-hidden="true">↗</span></a><div class="route-card-body"><div class="route-eyebrow"><span>⌁ {{ route.region }}</span><span>{{ route.days }} 天推荐</span></div><a class="route-title" href="{% url 'route_detail' route.slug %}">{{ route.title }}</a><p>{{ route.subtitle }}</p><div class="route-card-bottom"><span>约 {{ route.distance_km|floatformat:0 }} <small>km · 参考里程</small></span><span class="subtle-tag">{{ route.season }}</span></div></div></article>
