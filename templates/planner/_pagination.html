{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="分页">{% if page.has_previous %}<a class="btn btn-outline btn-small" href="?q={{ request.GET.q|urlencode }}&amp;category={{ request.GET.category|urlencode }}&amp;region={{ request.GET.region|urlencode }}&amp;days={{ request.GET.days|default:''|urlencode }}&amp;saved={{ request.GET.saved|default:''|urlencode }}&amp;page={{ page.previous_page_number }}">← 上一页</a>{% endif %}<span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页 · 共 {{ page.paginator.count }} 条</span>{% if page.has_next %}<a class="btn btn-outline btn-small" href="?q={{ request.GET.q|urlencode }}&amp;category={{ request.GET.category|urlencode }}&amp;region={{ request.GET.region|urlencode }}&amp;days={{ request.GET.days|default:''|urlencode }}&amp;saved={{ request.GET.saved|default:''|urlencode }}&amp;page={{ page.next_page_number }}">下一页 →</a>{% endif %}</nav>{% endif %}
