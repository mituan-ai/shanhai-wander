{% extends 'base.html' %}{% block title %}注册 · 山海漫游{% endblock %}{% block content %}<section class="auth-layout container"><div class="auth-story"><span class="eyebrow muted">EVERY JOURNEY STARTS SOMEWHERE</span><h1>给下一段旅程，<br>一个小小的开始。</h1><p>一个账号，收好你的旅行灵感。<br>路线默认私密，分享由你决定。</p><div class="auth-road">↝</div></div><div class="panel auth-panel"><h2>你好，新的旅伴。</h2><p>免费创建账号，开始规划旅行</p><form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="btn btn-primary full-width">创建账号，出发 →</button></form><p class="auth-switch">已经有账号？<a href="{% url 'login' %}">直接登录</a></p></div></section>{% endblock %}
